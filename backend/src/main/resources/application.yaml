
spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual
  mvc:
    servlet:
      path: /api/v1
  application:
    name: b2list
  datasource:
    url: jdbc:postgresql://localhost:5432/b2list
    driver-class-name: org.postgresql.Driver
    username: felipe
    password: felipe
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false
    validate-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration
    schemas: public
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        connection:
          isolation: 2
          password: ${spring.datasource.password}
          username: ${spring.datasource.username}
          url: ${spring.datasource.url}
logging:
  level:
    org.flywaydb: INFO
    org.hibernate.orm.connections: INFO
jwt:
  secret: mocked-jwt-secret-key-for-development-that-must-be-at-least-256-bits-long
  expiration: 3600000
rabbitmq:
  dlq:
    ttl: 5000
  parking-lot:
    ttl: 2592000000
